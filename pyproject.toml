[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "1.0.0"
description = "JARVIS AI - Ultimate Desktop Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "JARVIS AI Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PySide6>=6.7.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.3.0",
    "pyttsx3>=2.90",
    "psutil>=5.9.0",
    "apscheduler>=3.10.0",
    "toml>=0.10.2",
    "structlog>=24.1.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
face = [
    "insightface>=0.7.3",
    "onnxruntime>=1.18.0",
]
speech = [
    "SpeechRecognition>=3.10.0",
    "pvporcupine>=3.0.0",
    "pyaudio>=0.2.14",
]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]
all = [
    "jarvis-ai[face,speech,gpu]",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[project.gui-scripts]
jarvis-gui = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",
    "N802",   # Qt overrides require camelCase (paintEvent, enterEvent, etc.)
    "N815",   # Qt Property names require camelCase
]

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "-v --tb=short"
